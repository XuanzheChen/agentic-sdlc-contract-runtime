name: tests

on:
  push:
  pull_request:

jobs:
  psc-skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -r requirements-mcp.txt
      - run: python -m pytest tests -q