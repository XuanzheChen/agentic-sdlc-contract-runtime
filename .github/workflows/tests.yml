name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  psc-skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -r requirements-mcp.txt
      - run: python -m pytest tests -q

  apply-scoped-retry-patch:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run scoped retry patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/executor-mcp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute embedded patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          text = Path('.github/workflows/apply-scoped-supervisor-retry.yml').read_text(encoding='utf-8')
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY\n", start)
          code = textwrap.dedent(text[start:end])
          exec(compile(code, 'embedded-scoped-retry-patch', 'exec'), {})
          PY
      - run: python -m pip install pytest -r requirements-mcp.txt
      - run: python -m pytest tests -q
      - name: Commit and push feature patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/psc_runtime.py scripts/psc_mcp_server.py SKILL.md references/runtime-protocol.md tests/test_runtime_hardening.py tests/test_executor_mcp.py
          git commit -m "feat: add scoped Supervisor retry-exhaustion takeover"
          git push origin HEAD:feature/executor-mcp
