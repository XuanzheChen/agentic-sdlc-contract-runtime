name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  psc-skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -r requirements-mcp.txt
      - run: python -m pytest tests -q

  apply-executor-env-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/executor-mcp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply environment isolation patch when missing
        shell: bash
        run: |
          if grep -q 'SUPERVISOR_ENV_DENYLIST' scripts/invoke_executor.py; then
            echo 'Executor environment isolation already applied.'
            exit 0
          fi
          python scripts/_apply_executor_env_isolation_tmp.py
      - run: python -m pip install pytest -r requirements-mcp.txt
      - run: python -m pytest tests -q
      - name: Commit and push feature patch when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/invoke_executor.py tests/test_runtime_hardening.py SKILL.md references/runtime-protocol.md
          git commit -m "fix: isolate Executor auth from Supervisor environment"
          git push origin HEAD:feature/executor-mcp
