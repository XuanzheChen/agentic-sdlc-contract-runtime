name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  psc-skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -r requirements-mcp.txt
      - run: python -m pytest tests -q

  apply-scoped-retry-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/executor-mcp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch only when missing
        shell: bash
        run: |
          if grep -q 'switch-to-supervisor-for-current-task' scripts/psc_runtime.py; then
            echo 'Scoped retry patch already applied.'
            exit 0
          fi
          python scripts/_apply_scoped_retry_patch_tmp.py
      - run: python -m pip install pytest -r requirements-mcp.txt
      - run: python -m pytest tests -q
      - name: Commit and push feature patch when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/psc_runtime.py scripts/psc_mcp_server.py SKILL.md references/runtime-protocol.md tests/test_runtime_hardening.py tests/test_executor_mcp.py
          git commit -m "feat: add scoped Supervisor retry-exhaustion takeover"
          git push origin HEAD:feature/executor-mcp
